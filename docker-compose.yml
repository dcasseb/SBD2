services:
  postgres:
    image: postgres:15-alpine
    container_name: sbd2_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crime_data}
      POSTGRES_USER: ${POSTGRES_USER:-sbd2}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sbd2_password}
      TZ: ${TZ:-UTC}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sbd2 -d crime_data"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
